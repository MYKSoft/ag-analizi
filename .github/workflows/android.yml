name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9

    - name: Decode Keystore
      if: github.event_name != 'pull_request'
      shell: python
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        import base64
        import os
        import re
        
        keystore_b64 = os.environ.get('KEYSTORE_BASE64', '')
        # Clean up: remove whitespace, newlines, and invalid characters
        keystore_b64 = re.sub(r'[^a-zA-Z0-9+/=]', '', keystore_b64)
        
        try:
            keystore_bytes = base64.b64decode(keystore_b64, validate=True)
            with open('app/release.keystore', 'wb') as f:
                f.write(keystore_bytes)
            print(f"Keystore successfully decoded. Size: {len(keystore_bytes)} bytes")
        except Exception as e:
            print(f"Error: Could not decode keystore. {e}")
            exit(1)

    - name: Build Release APK and Bundle
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_PATH: release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
        ./gradlew bundleRelease
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Ag.Analizi.Pro.apk
        mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Ag.Analizi.Pro.aab

    - name: Upload Release Artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-artifacts
        path: |
          app/build/outputs/apk/release/Ag.Analizi.Pro.apk
          app/build/outputs/bundle/release/Ag.Analizi.Pro.aab
