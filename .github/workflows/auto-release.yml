name: Otomatik APK Yayınlama

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: Decode Keystore
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          import base64
          import os
          import re
          
          keystore_b64 = os.environ.get('KEYSTORE_BASE64', '')
          # Clean up: remove whitespace, newlines, and invalid characters
          keystore_b64 = re.sub(r'[^a-zA-Z0-9+/=]', '', keystore_b64)
          
          try:
              keystore_bytes = base64.b64decode(keystore_b64, validate=True)
              with open('app/release.keystore', 'wb') as f:
                  f.write(keystore_bytes)
              print(f"Keystore successfully decoded. Size: {len(keystore_bytes)} bytes")
          except Exception as e:
              print(f"Error: Could not decode keystore. {e}")
              exit(1)

      - name: APK Derle (Gradle)
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Ag.Analizi.Pro.apk

      - name: Versiyon Bilgisini Oku
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "VERSION_NAME=v$VERSION_NAME" >> $GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Sürüm Etiketi Oluştur
        run: |
          TAG_NAME="v${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag $TAG_NAME
            git push origin $TAG_NAME
            echo "created=true" >> $GITHUB_OUTPUT
          else
            echo "created=false" >> $GITHUB_OUTPUT
          fi
        id: tag_status

      - name: GitHub Release Oluştur ve APK Yükle
        if: steps.tag_status.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Sürüm ${{ steps.get_version.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
